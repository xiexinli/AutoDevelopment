<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 脱敏（REQ-AUTH-005）：页面标题不得出现 PRD 正文/业务代码 -->
    <title>AutoDevelopment</title>
    <!--
      主题防闪白：在样式与业务 JS 之前先按 `ad.theme`（浅色/深色/跟随系统）写好 `html[data-ad-theme]`，
      与 `src/theme.ts` 的规则保持一致（改这里时两处一起改）。
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("ad.theme");
          if (m !== "light" && m !== "dark") m = "system";
          var t = m === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : m;
          document.documentElement.dataset.adTheme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) { /* 隐私模式等：交给 theme.ts 兜底 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
